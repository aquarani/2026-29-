<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>관리자 대시보드 - 2026년 제29회 춘천시청소년문화축제</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{box-sizing:border-box;font-family:'Pretendard',sans-serif}body{background:#f5f5f7;margin:0;padding:24px;color:#333}.wrap{max-width:1200px;margin:auto}.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.top a,.top button{padding:9px 12px;border:1px solid #ddd;background:#fff;border-radius:8px;color:#555;text-decoration:none;cursor:pointer}.top .danger{margin-left:auto}h1{margin:20px 0}.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:30px}.stat-card{background:#fff;padding:20px;border-radius:12px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.06)}.stat-card .num{font-size:2rem;font-weight:700;color:#ff7e5f}.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-bottom:30px}.chart-box{background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);min-height:320px}.table-wrap{overflow:auto;background:#fff;border-radius:12px}table{width:100%;border-collapse:collapse;min-width:780px}th,td{padding:10px;text-align:center;border-bottom:1px solid #eee;font-size:.88rem}th{background:#ff7e5f;color:#fff;position:sticky;top:0}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 15px}.toolbar input{padding:10px;border:1px solid #ddd;border-radius:8px;min-width:220px}.toolbar button{padding:10px 14px;border:0;background:#ff7e5f;color:#fff;border-radius:8px;cursor:pointer}#loading{padding:40px;text-align:center}.muted{color:#888;font-size:.85rem}
</style>
</head>
<body>
<div class="wrap">
<div id="loading">관리자 권한 확인 중...</div>
<div id="app" style="display:none">
  <div class="top"><a href="index.html">← 홈</a><a href="checkin.html">📷 입장 스캔</a><button id="refreshBtn">↻ 새로고침</button><button id="logoutBtn" class="danger">로그아웃</button></div>
  <h1>📊 축제 입장 현황 대시보드</h1>
  <div class="stats-grid">
    <div class="stat-card"><div class="num" id="totalReg">0</div>사전등록 인원</div>
    <div class="stat-card"><div class="num" id="totalCheckin">0</div>입장 완료 인원</div>
    <div class="stat-card"><div class="num" id="checkinRate">0%</div>입장률</div>
  </div>
  <div class="charts">
    <div class="chart-box"><canvas id="genderChart"></canvas></div>
    <div class="chart-box"><canvas id="ageChart"></canvas></div>
    <div class="chart-box"><canvas id="regionChart"></canvas></div>
  </div>
  <div class="toolbar"><input id="searchInput" placeholder="이름·거주지 검색"><button id="csvBtn">📥 CSV 다운로드</button><span class="muted">CSV에는 개인정보가 포함될 수 있으므로 관리자만 보관하세요.</span></div>
  <div class="table-wrap"><table><thead><tr><th>이름</th><th>성별</th><th>연령대</th><th>거주지</th><th>등록일시</th><th>입장상태</th><th>입장일시</th></tr></thead><tbody id="tableBody"></tbody></table></div>
</div>
</div>
<script src="storage.js"></script>
<script>
let participants=[];let charts=[];
function countBy(arr,key){const out={};arr.forEach(x=>{const k=x[key]||'미입력';out[k]=(out[k]||0)+1;});return out;}
function formatDate(v){if(!v)return '-';return new Date(v).toLocaleString('ko-KR');}
function escapeHtml(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function drawChart(canvasId,type,title,count){
  const chart=new Chart(document.getElementById(canvasId),{type,data:{labels:Object.keys(count),datasets:[{label:'인원',data:Object.values(count)}]},options:{responsive:true,maintainAspectRatio:false,plugins:{title:{display:true,text:title},legend:{display:type!=='bar'}}}});charts.push(chart);
}
function renderTable(list){
  const tbody=document.getElementById('tableBody');
  if(!list.length){tbody.innerHTML='<tr><td colspan="7" style="padding:40px;color:#999">표시할 참가자가 없습니다.</td></tr>';return;}
  tbody.innerHTML=list.map(p=>`<tr><td>${escapeHtml(p.name)}</td><td>${escapeHtml(p.gender)}</td><td>${escapeHtml(p.age_group)}</td><td>${escapeHtml(p.sido)} ${escapeHtml(p.sigungu)}</td><td>${formatDate(p.created_at)}</td><td>${p.checked_in?'✅ 입장':'⏳ 미입장'}</td><td>${formatDate(p.checked_in_at)}</td></tr>`).join('');
}
async function loadDashboard(){
  participants=await DB.getParticipants();
  const checked=participants.filter(p=>p.checked_in);
  document.getElementById('totalReg').textContent=participants.length.toLocaleString();
  document.getElementById('totalCheckin').textContent=checked.length.toLocaleString();
  document.getElementById('checkinRate').textContent=participants.length?Math.round(checked.length/participants.length*1000)/10+'%':'0%';
  charts.forEach(c=>c.destroy());charts=[];
  drawChart('genderChart','pie','성별 분포 (입장자 기준)',countBy(checked,'gender'));
  drawChart('ageChart','bar','연령대 분포 (입장자 기준)',countBy(checked,'age_group'));
  drawChart('regionChart','doughnut','거주지 분포 (입장자 기준)',countBy(checked,'sido'));
  renderTable(participants);
}
function csvEscape(v){const s=String(v??'');return '"'+s.replace(/"/g,'""')+'"';}
function downloadCSV(){
  const header=['이름','성별','연령대','시군구','읍면동','등록일시','입장여부','입장일시'];
  const rows=participants.map(p=>[p.name,p.gender,p.age_group,p.sido,p.sigungu,formatDate(p.created_at),p.checked_in?'입장':'미입장',formatDate(p.checked_in_at)]);
  const csv='\ufeff'+[header,...rows].map(r=>r.map(csvEscape).join(',')).join('\r\n');
  const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a');a.href=url;a.download='춘천시청소년문화축제_참가자_입장현황.csv';a.click();URL.revokeObjectURL(url);
}
(async()=>{
  try{
    const auth=await DB.requireRole(['admin']);if(!auth)return;
    document.getElementById('loading').style.display='none';document.getElementById('app').style.display='block';
    await loadDashboard();
  }catch(err){console.error(err);alert('대시보드를 불러오는 중 오류가 발생했습니다: '+(err.message||''));}
})();

document.getElementById('refreshBtn').addEventListener('click',()=>loadDashboard().catch(e=>alert(e.message)));
document.getElementById('csvBtn').addEventListener('click',downloadCSV);
document.getElementById('logoutBtn').addEventListener('click',async()=>{await DB.signOut();location.replace('login.html');});
document.getElementById('searchInput').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();renderTable(!q?participants:participants.filter(p=>[p.name,p.sido,p.sigungu].some(v=>String(v||'').toLowerCase().includes(q))));});
</script>
</body>
</html>
