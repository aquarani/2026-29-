<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>입장 확인 - 스태프용</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  body { font-family:sans-serif; background:#222; color:white; text-align:center; padding:20px; }
  #reader { width:100%; max-width:400px; margin:20px auto; }
  #status { margin-top:20px; padding:20px; border-radius:12px; font-size:1.2rem; min-height:20px; }
  .ok { background:#2ecc71; }
  .dup { background:#e67e22; }
  .fail { background:#e74c3c; }
  h2 { margin-bottom:10px; }
</style>
</head>
<body>
  <h2>🎫 현장 입장 확인</h2>
  <div id="reader"></div>
  <div id="status"></div>

<script src="storage.js"></script>
<script>
function onScanSuccess(decodedText) {
  const p = DB.findParticipant(decodedText);
  const status = document.getElementById("status");

  if (!p) {
    status.className = "fail";
    status.innerText = "❌ 등록되지 않은 QR입니다.";
    return;
  }
  if (DB.isCheckedIn(p.id)) {
    status.className = "dup";
    status.innerText = "⚠️ " + p.name + "님은 이미 입장하셨습니다.";
    return;
  }

  DB.addCheckin({
    participantId: p.id,
    checkedInAt: new Date.toISOString
  });

  status.className = "ok";
  status.innerText = "✅ " + p.name + "님 입장 완료!";
}

const scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
scanner.render(onScanSuccess);
</script>
</body>
</html>
