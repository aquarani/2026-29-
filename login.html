<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>운영자 로그인 - 춘천시청소년문화축제</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;font-family:'Pretendard',sans-serif}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f5f7;padding:20px}.box{width:100%;max-width:420px;background:#fff;padding:30px;border-radius:16px;box-shadow:0 4px 16px rgba(0,0,0,.08)}h1{text-align:center;color:#ff7e5f;font-size:1.4rem}p{color:#777;font-size:.88rem;text-align:center;line-height:1.5}label{display:block;font-weight:700;margin:14px 0 6px}input{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:1rem}.btn{width:100%;padding:14px;border:0;border-radius:50px;background:#ff7e5f;color:#fff;font-weight:700;font-size:1rem;margin-top:20px;cursor:pointer}.btn:disabled{background:#ccc}.error{display:none;margin-top:14px;padding:10px;background:#fff0f0;color:#b42318;border-radius:8px;font-size:.85rem}.back{display:block;text-align:center;margin-top:16px;color:#999;text-decoration:none}
</style>
</head>
<body>
<div class="box">
  <h1>🔐 운영자 로그인</h1>
  <p>입장 스태프와 관리자 전용 페이지입니다.</p>
  <form id="loginForm">
    <label for="email">이메일</label><input id="email" type="email" autocomplete="username" required>
    <label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" required>
    <button class="btn" id="loginBtn" type="submit">로그인</button>
    <div class="error" id="errorBox"></div>
  </form>
  <a class="back" href="index.html">← 축제 홈으로</a>
</div>
<script src="storage.js"></script>
<script>
const form=document.getElementById('loginForm');
const btn=document.getElementById('loginBtn');
const errorBox=document.getElementById('errorBox');

(async()=>{
  try{
    const session=await DB.getSession();
    if(session){
      const role=await DB.getCurrentUserRole();
      if(role==='admin') location.replace('admin.html');
      if(role==='staff') location.replace('checkin.html');
    }
  }catch(e){ console.error(e); }
})();

form.addEventListener('submit',async(e)=>{
  e.preventDefault();
  errorBox.style.display='none';
  btn.disabled=true;btn.textContent='로그인 중...';
  try{
    await DB.signIn(document.getElementById('email').value.trim(),document.getElementById('password').value);
    const role=await DB.getCurrentUserRole();
    if(role==='admin') return location.replace('admin.html');
    if(role==='staff') return location.replace('checkin.html');
    await DB.signOut();
    throw new Error('이 계정에 운영 권한이 지정되어 있지 않습니다.');
  }catch(err){
    console.error(err);
    errorBox.textContent=err.message||'로그인에 실패했습니다.';
    errorBox.style.display='block';
    btn.disabled=false;btn.textContent='로그인';
  }
});
</script>
</body>
</html>
