<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 대시보드 - 2026 가을 축제</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  * { box-sizing:border-box; font-family:'Pretendard', sans-serif; }
  body { background:#f5f5f7; margin:0; padding:24px; }
  h1 { color:#333; margin-bottom:20px; }
  .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:16px; margin-bottom:30px; }
  .stat-card { background:white; padding:20px; border-radius:12px; text-align:center; box-shadow:0 2px 8px rgba(0,0,0,0.06); }
  .stat-card .num { font-size:2rem; font-weight:bold; color:#ff7e5f; }
  .charts { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:20px; margin-bottom:30px; }
  .chart-box { background:white; padding:20px; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.06); }
  table { width:100%; border-collapse:collapse; background:white; border-radius:12px; overflow:hidden; }
  th, td { padding:10px; text-align:center; border-bottom:1px solid #eee; font-size:0.9rem; }
  th { background:#ff7e5f; color:white; }
  a.back { display:inline-block; margin-bottom:16px; color:#666; text-decoration:none; }
  .checkin-link { display:inline-block; margin-bottom:16px; margin-left:16px; color:#ff7e5f; font-weight:bold; }
  .empty-msg { text-align:center; color:#999; padding:40px; background:white; border-radius:12px; }
</style>
</head>
<body>
<a href="index.html" class="back">← 축제 홈으로</a>
<a href="checkin.html" class="checkin-link">📷 스태프 스캔 화면 열기</a>
<h1>📊 축제 입장 현황 대시보드</h1>

<div class="stats-grid">
  <div class="stat-card"><div class="num" id="totalReg">0</div>사전등록 인원</div>
  <div class="stat-card"><div class="num" id="totalCheckin">0</div>입장 완료 인원</div>
  <div class="stat-card"><div class="num" id="checkinRate">0%</div>입장율</div>
</div>

<div class="charts">
  <div class="chart-box"><canvas id="genderChart"></canvas></div>
  <div class="chart-box"><canvas id="ageChart"></canvas></div>
  <div class="chart-box"><canvas id="regionChart"></canvas></div>
</div>

<table>
  <thead><tr><th>이름</th><th>성별</th><th>연령대</th><th>거주지</th><th>입장상태</th></tr></thead>
  <tbody id="tableBody"></tbody>
</table>

<script src="storage.js"></script>
<script>
const participants = DB.getParticipants;
const checkins = DB.getCheckins;
const checkedInIds = checkins.map(c => c.participantId);

// ===== 상단 통계 카드 =====
document.getElementById('totalReg').innerText = participants.length;
document.getElementById('totalCheckin').innerText = checkins.length;
document.getElementById('checkinRate').innerText =
  participants.length ? Math.round((checkins.length / participants.length) * 100) + '%' : '0%';

// ===== 입장 완료자만 통계 대상으로 사용 =====
const checkedInParticipants = participants.filter(p => checkedInIds.includes(p.id));

function countBy(arr, key) {
  const result = {};
  arr.forEach(item => { result[item[key]] = (result[item[key]]||0) + 1; });
  return result;
}
const genderCount = countBy(checkedInParticipants, 'gender');
const ageCount = countBy(checkedInParticipants, 'ageGroup');
const regionCount = countBy(checkedInParticipants, 'sido');

new Chart(document.getElementById('genderChart'), {
  type:'pie',
  data:{ labels:Object.keys(genderCount), datasets:[{ data:Object.values(genderCount), backgroundColor:['#ff7e5f','#feb47b','#ffd8a8'] }]},
  options:{ plugins:{ title:{ display:true, text:'성별 분포 (입장자 기준)' } } }
});
new Chart(document.getElementById('ageChart'), {
  type:'bar',
  data:{ labels:Object.keys(ageCount), datasets:[{ label:'인원', data:Object.values(ageCount), backgroundColor:'#ff7e5f' }]},
  options:{ plugins:{ title:{ display:true, text:'연령대 분포 (입장자 기준)' } } }
});
new Chart(document.getElementById('regionChart'), {
  type:'doughnut',
  data:{ labels:Object.keys(regionCount), datasets:[{ data:Object.values(regionCount), backgroundColor:['#ff7e5f','#feb47b','#ffd8a8','#f8b195','#c06c84'] }]},
  options:{ plugins:{ title:{ display:true, text:'거주지 분포 (입장자 기준)' } } }
});

// ===== 참가자 명단 테이블 =====
const tbody = document.getElementById('tableBody');
if (participants.length === 0) {
  tbody.innerHTML = `<tr><td colspan="5" style="padding:40px;color:#999;">아직 등록된 참가자가 없습니다.</td></tr>`;
} else {
  participants.forEach(p => {
    const isIn = checkedInIds.includes(p.id);
    tbody.innerHTML += `<tr>
      <td>${p.name}</td><td>${p.gender}</td><td>${p.ageGroup}</td>
      <td>${p.sido} ${p.sigungu}</td>
      <td>${isIn ? '✅ 입장' : '⏳ 미입장'}</td>
    </tr>`;
  });
}
</script>
</body>
</html>
